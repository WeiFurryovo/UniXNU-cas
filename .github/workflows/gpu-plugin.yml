name: GPU plugin

# UniXNU's Adreno Metal plugin (drivers/AdrenoMetal: NativeAdrenoMetal.bundle with Turnip and the metal2vulkan bridge) packed as
# the GPU addon the payload carries (unixnu build payload --gpu-addon), built on a hosted macOS runner because it needs the
# iphoneos SDK and codesign. scripts/ci/build-gpu-plugin.py runs build-boot-runtime.py build_plugin('ios') (Mesa + recorded
# patches, build-turnip-darwin.py --target ios, build-adreno-metal-plugin.py --target ios --no-replay) and
# make-gpu-addon.py --publish --no-daemon, then checks the addon's executables against trust.json's CDHashes.
#
# Kernel ABI: Turnip's Darwin backend and the plugin compile against drivers/Adreno740's NativeAdrenoABI.h (UniXNU's pin).
# FFT-infra/Adreno650@70771a7 (cas's kernel driver, scripts/build-adreno650.py) has the same header minus methods 17
# (SetPriority) and 18 (Note) and their structs; the version (2), every other method number and every layout are the same.
# Turnip names both methods, so the A650 header does not compile it; the A650 user client answers both with
# kIOReturnUnsupported (inputSize/outputSize SIZE_MAX), which Turnip ignores (SetPriority at open) or reports as false.
#
# Built only from open sources and the SDK: the artifact (addon, trust.json, logs) is not encrypted and is never committed.

on:
  # workflow_dispatch only reaches workflows on the default branch, so a push of this file or its script to the work
  # branch also runs it (with the input defaults).
  push:
    branches: [wf/m1]
    paths: ['.github/workflows/gpu-plugin.yml', 'scripts/ci/build-gpu-plugin.py']
  workflow_dispatch:
    inputs:
      unixnu_ref:
        description: UniXNU commit the plugin is built from
        required: true
        default: e2fdae4312d0acc3d8a52bc457101e7918095e6a

permissions:
  contents: read

env:
  UNIXNU_REF: ${{ inputs.unixnu_ref || 'e2fdae4312d0acc3d8a52bc457101e7918095e6a' }}
  RUST_TOOLCHAIN: 1.98.0
  BISON_VERSION: 3.8.2
  BISON_SHA256: 9bba0214ccf7f1079c5d59210045227bcf619519840ebfa80cd3849cff5a5bf2

jobs:
  plugin:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Check out this repository (build script)
        uses: actions/checkout@v4
        with:
          path: cas
          persist-credentials: false

      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: ${{ env.UNIXNU_REF }}
          path: unixnu
          persist-credentials: false

      # Only what the plugin reads: AdrenoMetal (plugin, bridge), Adreno740 (NativeAdrenoABI.h), AdrenoPM4 and
      # GopFramebuffer (GpuScanoutPresenter.h). drivers/ArmCpu and the others are not initialised.
      - name: Fetch the plugin's submodules
        run: |
          set -euo pipefail
          git -C unixnu submodule update --init --depth 1 \
            drivers/AdrenoMetal drivers/Adreno740 kits/AdrenoPM4 drivers/GopFramebuffer
          git -C unixnu submodule status drivers/AdrenoMetal drivers/Adreno740 kits/AdrenoPM4 drivers/GopFramebuffer

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the host tools
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install glslang shaderc spirv-tools ninja llvm
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target aarch64-apple-ios
          {
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-path
            xcrun --sdk iphoneos clang --version | head -1
            /opt/homebrew/opt/llvm/bin/llvm-as --version | head -2
            glslangValidator --version | head -1
            glslc --version | head -1
            spirv-val --version | head -1
            ninja --version
            cargo "+$RUST_TOOLCHAIN" --version
            python3 --version
            flex --version
          } 2>&1 | tee "$RUNNER_TEMP/toolchain.txt"

      - name: Restore the pinned bison
        id: bison-cache
        uses: actions/cache@v4
        with:
          path: unixnu/.cache/mesa-tools
          key: mesa-tools-bison-${{ env.BISON_VERSION }}-macos-26-arm64

      - name: Build the pinned bison
        if: steps.bison-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/bison"
          mkdir -p "$src"
          for url in https://ftp.gnu.org/gnu/bison https://ftpmirror.gnu.org/bison https://mirrors.kernel.org/gnu/bison; do
            curl -fsSL --retry 3 -o "$src/bison.tar.xz" "$url/bison-$BISON_VERSION.tar.xz" && break
          done
          echo "$BISON_SHA256  $src/bison.tar.xz" | shasum -a 256 -c -
          tar -C "$src" -xf "$src/bison.tar.xz"
          cd "$src/bison-$BISON_VERSION"
          ./configure --prefix="$GITHUB_WORKSPACE/unixnu/.cache/mesa-tools" --disable-nls > /dev/null
          make -j"$(sysctl -n hw.ncpu)" > /dev/null
          make install > /dev/null
          "$GITHUB_WORKSPACE/unixnu/.cache/mesa-tools/bin/bison" --version | head -1

      - name: Restore the cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ env.RUST_TOOLCHAIN }}-${{ github.run_id }}
          restore-keys: cargo-registry-${{ env.RUST_TOOLCHAIN }}-

      - name: Build the plugin and the GPU addon
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          python3 cas/scripts/ci/build-gpu-plugin.py unixnu "$RUNNER_TEMP/out" 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Collect the outputs and logs
        if: always()
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/out"
          mkdir -p "$out/logs"
          cp "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/toolchain.txt" "$out/logs/" 2>/dev/null
          cp unixnu/.cache/mesa-tu-ios-*.log "$out/logs/" 2>/dev/null
          cp unixnu/build/adreno-metal-bridge/build-ios.log "$out/logs/bridge-build-ios.log" 2>/dev/null
          cp unixnu/build/mesa-tu-ios/builtin-build-profile.json "$out/" 2>/dev/null
          cp unixnu/build/mesa-tu-ios/meson-logs/meson-log.txt "$out/logs/mesa-meson-log.txt" 2>/dev/null
          if [ -d unixnu/build/adreno-metal-plugin/NativeAdrenoMetal.bundle ]; then
            tar -C unixnu/build/adreno-metal-plugin -czf "$out/NativeAdrenoMetal.bundle.tar.gz" NativeAdrenoMetal.bundle
          fi
          {
            echo "unixnu $(git -C unixnu rev-parse HEAD)"
            git -C unixnu submodule status drivers/AdrenoMetal drivers/Adreno740 kits/AdrenoPM4 drivers/GopFramebuffer
            (cd "$out" && shasum -a 256 gpuaddon.bin trust.json NativeAdrenoMetal.bundle.tar.gz 2>/dev/null)
            cat "$out/trust.json" 2>/dev/null
          } | tee "$out/inputs.txt"
          { echo '### GPU plugin'; echo '```'; cat "$out/inputs.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cas-gpu-plugin
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 7
