schema_version = 2

[board]
name = "cas"
arch = "AARCH64"
kit = "cas"
soc = "SM8250"
soc_source = "sm8250"
os_profile = "ipados-17.7.11-21H461"
description = "Xiaomi 10 Ultra (cas): iPadOS 17.7.11 on UniXNU"

[components]
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "ShengUfs", "VirtioMmioBlock", "RamBlock", "XnuPrelink", "DarwinBoot", "GopFramebuffer", "AppleKeyStoreState"]

[kernel]
# Storage archives (the UniXNU-alioth chain): ShengUfs is checked but not bound by itself, because the
# force-loaded verified Virtio bundle carries the one binding object for both drivers' original
# IOStorageFamily imports (two archives cannot both define the absolute names). The RAM transport is
# linked as its bare object and cross-checked against that binding. The probe archive embeds the
# owner-signed OS and SystemOS policies (scripts/build-owner-root-policies.py).
defconfig = "cas_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8250.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]
# cas-armcpu-asm-fix.py must run before component:ArmCpu: it stages ArmCpu with the
# Darwin assembler separator fix that upstream ArmCpu 9066b53 still lacks.
archives = ["build-corecrypto-14.py", "build-corecrypto-14.py --namespace", "component:ArmDTPlatform", "cas-armcpu-asm-fix.py", "component:ArmCpu", "component:SoftwareAES", "build-software-aes-bindings.py", "component:ShengUfs", "build-storage-bindings.py --component NativeUfs --archive libShengUfs.a --directory build/sheng-ufs --verify-only", "component:VirtioMmioBlock", "component:RamBlock", "build-storage-bindings.py --component NativeRamBlock --archive libRamBlock.a --directory build/ram-block", "build-arm-driver.py VirtioMmioBlock --verified-root --verified-root-bundle", "build-storage-bindings.py --component NativeVirtioBlock --archive libVirtioMmioBlock.a --directory build/virtio-mmio-block-verified-bundle --include-object build/sheng-ufs/NativeUfs.o", "cas-verified-root-probe.py --component os --include-systemos", "build-link-stubs.py", "build-mockfs-fixture.py", "build-platform-power.py", "build-libpthread-kernel.py", "component:AppleKeyStoreState", "build-cas-touch.py", "build-gop-legacy-display.py"]

[device_tree]
source = "device:dts/cas.dts"
include_dirs = ["soc:dts"]
preserve_memory_ranges = true
export_arch_timer = true

[firmware]
config = "cas"
dsc = "casPkg/cas-upstream.dsc"
fd = "Build/casUpstream001/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
defines = { CAS_BUILD_DIR = "Build/casUpstream001" }
packages = ["{uefi}/Platforms/Xiaomi", "{uefi}/Common/Mu", "{uefi}/Common/Mu_OEM_Sample", "{uefi}/Mu_Basecore", "{uefi}/Silicon/Qualcomm", "{uefi}/Silicon/Silicium", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}"]

# userdata on LUN0 (sda34), measured from the cas GPT; it holds the iOS root image.
[userdata]
first_lba = 0x2c0000
last_lba = 0x3b4b7fa
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[payload]
volume = "CAS_IOS17"
# The owner-root kernel carries the signed OS and SystemOS block hashes (~73 MB) and the payload files
# take 120 MiB; the builder wants 5% headroom. uefi-cas CAS_PAYLOAD_SIZE allows up to 192 MiB.
size_mib = 127
loader = "firmware"
title = "cas iPadOS 17"
timeout = 3
panic_screen = true
# sheng-pmgr=2 publishes the original ApplePMGR nub through ShengPlatformPower;
# without it AMFI's early security init panics with "AMFI: No PMGR?".
# native-ufs-stream/stream2: SM8250 routes the UFS host through apps SMMU streams 0xe0 and
# 0x4e0 (NativeUfs defaults to sheng's 0x60). native-ufs-root=1 admits the root-device
# personality, which publishes the SHNGROOT windows of userdata (m2a-001 proved the reads with
# native-ufs-probe=10). -apfs_shared_datavolume lets keybagd take the shared-Data path: there is
# no SEP here. panic_on_crash_disabled keeps one crashing daemon from panicking the bring-up.
# No sheng-data-persist: the first root boots keep Data in RAM and write nothing to UFS.
# offline-mobile-graphics-load/-legacy-*: the CPU-presented display (UniXNU-umi attempt 80's set). register+phase=4
# publish NativeLegacyDisplay on the firmware frame buffer; pm/validate/transfer/cpu-present let it accept, copy and
# retire single-layer BGRA frames; unit-scale=2 publishes display-scale 2 (540x1170 points) in /chosen.
# Toward Hello (the UniXNU-alioth set): sheng-vsync=60 sends the compositor the vsync the GOP scanout cannot raise;
# offline-key-events + sheng-aks start the AppleKeyStore stand-in (no SEP: "no passcode, unlocked"). The watchdog
# policy (BootWatchdogPolicy.c) disables watchdogd, which has no hardware watchdog to pet here, plus the sheng-lite
# network/iCloud/photo jobs and three daemons alioth found looping or holding the CPU.
# Touch (umi attempt 80's set, umi- arguments renamed cas-): cas-fts starts the ST FTM5 worker, cas-fts-gpi drives SE13
# through GPI DMA, offline-hid-input/-home publish the HID device and sheng-touch-hid its digitizer report. cas-banner
# repaints the key store and touch rows over the bottom of the frame (BootProgressMin.c) while touch is brought up.
# SMP (umi's qualified set, same silicon and firmware family): sheng-smp=1 starts cpu1-7 by PSCI CPU_ON, IPIs stay SGIs
# (armcpu-spi-ipi=0) and armcpu-self-ipi=1 has each new core signal itself so XNU enables its IPI. armcpu-diagnostics
# keeps ArmCpu's step counters, which the banner shows in place of the touch firmware rows.
# sheng-cpufreq=3 (UniXNU-alioth's CpuFreqProbe): votes each kona EPSS domain (cpu0-3, cpu4-6, cpu7) its highest
# non-turbo level once the domain reads enabled; m4-001 had all eight cores but felt no faster than one, so the cores'
# firmware-left clock is the next suspect. Banner row 8 shows the current and pre-vote MHz per domain.
# sheng-data-persist=1: the Data store window at the end of userdata (below the 1 GiB log reserve, clear of the root
# image) is opened read-only (ShengUfs native_ufs_store_*, NativeRamBlock's overlay): it proves the window and reads its
# header, writes nothing, and Data stays in RAM. The banner's row 4 shows the store state.
kernel_args = ["-v", "keepsyms=1", "debug=0x14e", "kt_fixed_zones=120", "sheng-pmgr=2", "native-ufs-stream=0xe0", "native-ufs-stream2=0x4e0", "native-ufs-root=1", "-apfs_shared_datavolume", "panic_on_crash_disabled=1", "offline-mobile-graphics-load=1", "offline-legacy-register=1", "offline-legacy-gop=1", "offline-legacy-phase=4", "offline-legacy-pm=1", "offline-legacy-validate=1", "offline-legacy-transfer=1", "offline-legacy-cpu-present=1", "offline-legacy-unit-scale=2", "sheng-vsync=60", "offline-key-events=1", "sheng-aks=1", "sheng-disable-watchdogd=1", "sheng-lite=1", "sheng-disable-jobs=com.apple.liveactivitiesd,com.apple.cryptexd,com.apple.routined", "cas-fts=1", "cas-fts-gpi=1", "offline-hid-input=1", "offline-hid-home=1", "sheng-touch-hid=1", "cas-banner=1", "sheng-smp=1", "armcpu-spi-ipi=0", "armcpu-self-ipi=1", "armcpu-diagnostics=1", "sheng-cpufreq=3", "sheng-data-persist=1"]

[payload.adt]
chip_id = "8011"
owned_memory_size = "0x130000000"
cpu_regs = "0"
psci_method = "smc"
unique_chip_id = "required"
# The Data seed reaches the kernel packed (DBRDISK1): /chosen/memory-map/PackedRAMDisk.
packed_data_ramdisk = true
# /chosen/root-matching: the OS window's APFS volume UUID (the same IPSW as alioth/umi/sheng).
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"

[adt.root.string]
hardware-model = "Qualcomm Technologies, Inc. xiaomi cas"

# The os profile supplies the iPad7,1 / J120 identity. thin-bezel and the gesture-only buttons node (home-button-type 2)
# follow UniXNU-sheng: SpringBoard then draws the home indicator instead of expecting a Home button.
[adt.product.u32]
thin-bezel = 1

[adt.defaults.u32]
sleep-disabled = 1

[adt.buttons.string]
compatible = "buttons"
device_type = "buttons"

[adt.buttons.strings]
button-names = ["hold", "voldown", "volup"]

[adt.buttons.u32]
home-button-type = 2
